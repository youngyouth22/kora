name: kora
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  adaptive_responsive_nav:
    path: packages/adaptive_responsive_nav
  bloc_lint: ^0.4.3
  camera: ^0.12.1
  dartz: ^0.10.1
  dio: ^5.11.1
  drift: ^2.35.2
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_bloc: ^9.1.1
  flutter_local_notifications: ^22.3.2
  flutter_native_splash: ^2.4.8
  flutter_svg: ^2.3.0
  get_it: ^9.3.0
  go_router: ^18.0.2
  google_mlkit_barcode_scanning: ^0.16.1
  google_mlkit_face_detection: ^0.15.1
  google_mlkit_text_recognition: ^0.17.1
  google_sign_in: ^7.2.0
  image: ^4.12.0
  image_picker: ^1.2.4
  path: ^1.9.0
  path_provider: ^2.1.5
  permission_handler: ^13.0.2
  pinput: ^5.0.1
  purchases_flutter: ^10.16.0
  purchases_ui_flutter: ^10.16.0
  screen_brightness: ^2.1.11
  shared_preferences: ^2.5.4
  sqlite3_flutter_libs: ^0.5.24
  supabase: ^2.16.4

dev_dependencies:
  build_runner: ^2.4.9
  change_app_package_name: ^1.5.0
  drift_dev: ^2.24.2
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/mascot/
    - .env

  fonts:
    - family: ClashDisplay
      fonts:
        - asset: assets/fonts/ClashDisplay-Extralight.otf
          weight: 200
        - asset: assets/fonts/ClashDisplay-Light.otf
          weight: 300
        - asset: assets/fonts/ClashDisplay-Regular.otf
          weight: 400
        - asset: assets/fonts/ClashDisplay-Medium.otf
          weight: 500
        - asset: assets/fonts/ClashDisplay-SemiBold.otf
          weight: 600
        - asset: assets/fonts/ClashDisplay-Bold.otf
          weight: 700

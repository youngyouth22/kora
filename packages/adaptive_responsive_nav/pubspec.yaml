name: adaptive_responsive_nav
description: "A reusable, animated adaptive responsive navigation package supporting bottom bar and navigation rail with go_router integration."
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.0
  go_router: ">=10.0.0 <19.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
